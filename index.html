<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しゃぼん玉 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#9fd8f2; --sky-bottom:#eef9fe; --ink:#0e4e6e; --ink-soft:#3f7590;
  --btn:#0e4e6e; --btn-ink:#ffffff; --hud:rgba(14,78,110,.55); --hud-ink:#ffffff;
  --glow:rgba(255,255,255,.9); --focus:#f3b6d6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#0b2a3c; --sky-bottom:#1d4d66; --ink:#e3f5fc; --ink-soft:#a9cfe0;
    --btn:#c3ebf9; --btn-ink:#08263a; --hud:rgba(4,20,30,.62); --hud-ink:#eaf8fd;
    --glow:rgba(120,200,240,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-top:#0b2a3c; --sky-bottom:#1d4d66; --ink:#e3f5fc; --ink-soft:#a9cfe0;
  --btn:#c3ebf9; --btn-ink:#08263a; --hud:rgba(4,20,30,.62); --hud-ink:#eaf8fd;
  --glow:rgba(120,200,240,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;
  background:linear-gradient(var(--sky-top),var(--sky-bottom));
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none;
}
#stage{position:fixed;inset:0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
video.on{opacity:1}
video.mirror{transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

#start{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:20px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
  pointer-events:none;
}
#start > *{pointer-events:auto}
#start h1{
  margin:0;font-weight:800;font-size:clamp(64px,19vw,128px);line-height:1;letter-spacing:.02em;
  text-shadow:0 0 18px var(--glow),0 0 2px var(--glow);
}
#start p{margin:0;max-width:22em;font-weight:500;font-size:16px;line-height:1.8;color:var(--ink-soft)}
.primary{
  margin-top:8px;border:0;border-radius:999px;padding:16px 34px;
  background:var(--btn);color:var(--btn-ink);font-family:inherit;font-weight:800;font-size:18px;line-height:1;cursor:pointer;
}
.primary:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.note{font-size:13px !important}
#start .credit{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  max-width:none;font-size:13px;color:var(--ink-soft);
}

#hud{display:none}
#hud.on{display:block}
.hint,.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  max-width:calc(100% - 32px);padding:8px 16px;border-radius:999px;
  background:var(--hud);color:var(--hud-ink);font-size:14px;font-weight:500;line-height:1.5;text-align:center;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:opacity .6s;pointer-events:none;
}
.hint{top:calc(env(safe-area-inset-top,0px) + 12px)}
.toast{top:calc(env(safe-area-inset-top,0px) + 56px);opacity:0;border-radius:16px}
.toast.on{opacity:1}
.bar{
  position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;justify-content:center;gap:12px;
}
.round{
  border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:12px 20px;
  background:var(--hud);color:var(--hud-ink);font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.round[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.meter{display:inline-block;width:0;height:6px;border-radius:3px;background:currentColor;vertical-align:middle;margin-left:0;transition:width .08s}
.round[aria-pressed="true"] .meter{margin-left:8px}
.bar{flex-wrap:wrap;padding:0 12px}
.round{padding:12px 16px;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{
  position:fixed;left:16px;right:16px;margin:0 auto;max-width:420px;
  bottom:var(--above-bar, calc(env(safe-area-inset-bottom,0px) + 84px));
  padding:16px;border-radius:20px;background:var(--hud);color:var(--hud-ink);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.panel[hidden]{display:none}
.collect{
  position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 104px);
  max-width:calc(100% - 32px);padding:8px 20px;border-radius:999px;
  background:var(--hud);color:var(--hud-ink);font-size:24px;font-weight:800;letter-spacing:.08em;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.collect.on{opacity:1}
.fire{
  position:fixed;right:16px;bottom:var(--above-bar, calc(env(safe-area-inset-bottom,0px) + 84px));
  width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,255,255,.7);
  background:var(--hud);color:var(--hud-ink);font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:none;-webkit-touch-callout:none;
}
.fire[hidden]{display:none}
.fire.active{background:var(--btn);color:var(--btn-ink);border-color:transparent;transform:scale(.95)}
.panel label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.panel input{
  width:100%;font-family:inherit;font-size:18px;font-weight:800;padding:12px 14px;border:0;border-radius:12px;
  background:#ffffff;color:#0e4e6e;-webkit-user-select:text;user-select:text;touch-action:auto;
}
.panel input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.panel .row{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.panel .primary{margin:0;padding:12px 22px;font-size:16px}
.round{padding:10px 12px;font-size:14px}
.pinfo{margin:0 0 10px;font-size:14px;line-height:1.6}
.panel .code{font-size:32px;font-weight:800;letter-spacing:.2em;text-align:center;margin:4px 0 10px}
.panel .gap{height:10px}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="c" tabindex="0" aria-label="しゃぼん玉を飛ばす画面。タップで吹き、長押しで膨らませる"></canvas>
</div>

<div id="start">
  <h1>しゃぼん玉</h1>
  <p>タップでしゃぼん玉を吹く。<br>長押しで膨らませて、離すと飛んでいく。</p>
  <button class="primary" id="go">しゃぼん玉を飛ばす</button>
  <p class="note">カメラと動きセンサーの使用を<br>許可してください。</p>
  <p class="credit">©Oyaman</p>
</div>

<div id="hud">
  <div class="hint" id="hint">タップで吹く、長押しで膨らませる、飛んでいる玉をタップで割る</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="collect" id="collect" aria-live="polite"></div>
  <div class="bar">
    <button class="round" id="flip">カメラ切替</button>
    <button class="round" id="mic" aria-pressed="false">息で吹く<span class="meter" id="meter"></span></button>
    <button class="round" id="wordBtn" aria-pressed="false">ことば</button>
    <button class="round" id="pairBtn" aria-pressed="false">ふたりで</button>
  </div>
  <div class="panel" id="pairPanel" hidden>
    <label for="code">ふたりで遊ぶ</label>
    <p class="pinfo" id="pairInfo">片方が部屋を作り、もう片方がその部屋番号を入れて参加します。</p>
    <div class="code" id="pairCode" hidden></div>
    <div id="pairSetup">
      <div class="row" style="justify-content:flex-start;margin:0 0 12px"><button class="primary" id="host">部屋を作る</button></div>
      <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="部屋番号（4桁）" autocomplete="off">
    </div>
    <div class="row">
      <button class="round" id="pairClose">閉じる</button>
      <button class="round" id="aim" hidden>向きを合わせる</button>
      <button class="primary" id="join">参加する</button>
    </div>
  </div>
  <button class="fire" id="fire" hidden>リング</button>
  <div class="panel" id="wordPanel" hidden>
    <label for="word">しゃぼん玉に1文字ずつ込めることば</label>
    <input id="word" maxlength="20" placeholder="おめでとう" enterkeyhint="done" autocomplete="off">
    <div class="row">
      <button class="round" id="wordCancel">やめる</button>
      <button class="primary" id="wordOk">込める</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(() => {
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const video = document.getElementById('v');
let W = 0, H = 0, F = 600;

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  F = Math.max(W, H) / (2 * Math.tan(32 * Math.PI / 180));
}
addEventListener('resize', resize); resize();

/* ---------- 端末の向き ---------- */
let M = [1,0,0, 0,1,0, 0,0,1];
let Mprev = M.slice();
let hasOri = false;
let rotSpeed = 0;
function oriMatrix(a, b, g){
  const d = Math.PI / 180;
  const cA = Math.cos(a*d), sA = Math.sin(a*d), cB = Math.cos(b*d), sB = Math.sin(b*d), cG = Math.cos(g*d), sG = Math.sin(g*d);
  return [
    cA*cG - sA*sB*sG, -sA*cB, cA*sG + sA*sB*cG,
    sA*cG + cA*sB*sG,  cA*cB, sA*sG - cA*sB*cG,
    -cB*sG,            sB,    cB*cG
  ];
}
addEventListener('deviceorientation', e => {
  if (e.alpha == null || e.beta == null) return;
  hasOri = true;
  M = oriMatrix(e.alpha, e.beta, e.gamma || 0);
});
function scrAngle(){
  const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  return a * Math.PI / 180;
}

let front = false;

function project(p){
  const d0 = M[0]*p[0] + M[3]*p[1] + M[6]*p[2];
  const d1 = M[1]*p[0] + M[4]*p[1] + M[7]*p[2];
  const d2 = M[2]*p[0] + M[5]*p[1] + M[8]*p[2];
  const t = scrAngle(), c = Math.cos(t), s = Math.sin(t);
  const sx = c*d0 - s*d1, sy = s*d0 + c*d1;
  const z = front ? d2 : -d2;
  if (z < 0.03) return null;
  return { x: W/2 + F*sx/z, y: H/2 - F*sy/z, z, k: F/z };
}
function screenToWorld(x, y, z){
  const t = scrAngle(), c = Math.cos(t), s = Math.sin(t);
  const d0 = c*x + s*y, d1 = -s*x + c*y, d2 = z;
  return [M[0]*d0 + M[1]*d1 + M[2]*d2, M[3]*d0 + M[4]*d1 + M[5]*d2, M[6]*d0 + M[7]*d1 + M[8]*d2];
}
function rayFromScreen(px, py){
  const w = screenToWorld((px - W/2) / F, -(py - H/2) / F, front ? 1 : -1);
  const n = Math.hypot(w[0], w[1], w[2]) || 1;
  return [w[0]/n, w[1]/n, w[2]/n];
}

/* ---------- 音と振動 ---------- */
let actx = null;
function playPop(vol){
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * 0.07);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 3);
  const src = actx.createBufferSource(); src.buffer = buf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800 + Math.random()*1600; bp.Q.value = 1.2;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(bp).connect(g).connect(actx.destination);
  src.start();
}
function buzz(){ try { navigator.vibrate && navigator.vibrate(12); } catch(e){} }

/* ---------- しゃぼん玉 ---------- */
const R_MIN = 0.018, R_MAX = 0.16, HOLD_DIST = 0.32, GROW = 0.034;
const bubbles = [];
const sparks = [];
const holds = new Map();
const floatWords = [];
let now = 0;
let pendingChars = [];
function claimWord(b){
  if (pendingChars.length){ b.word = pendingChars.shift(); updateWordBtn(); }
  return b;
}

function makeBubble(p, r){
  return { p, v:[0,0,0], r, state:'free', born:now, life:14 + Math.random()*8,
           hue: Math.random()*360, seed: Math.random()*100, wob:0 };
}
function launch(b, dir, speed){
  b.state = 'free'; b.born = now;
  b.v = [dir[0]*speed, dir[1]*speed, dir[2]*speed];
  bubbles.push(b);
  if (started) shareBubble(b);
  while (bubbles.length > 160) popBubble(bubbles[0], 0);
}
function popBubble(b, vol){
  const i = bubbles.indexOf(b); if (i >= 0) bubbles.splice(i, 1);
  if (b.id && !b.remotePop) sendPair({ t:'pop', id:b.id });
  const s = project(b.p);
  if (!s) return;
  const R = b.r * s.k;
  if (b.word){
    floatWords.push({ text:b.word, x:s.x, y:s.y, age:0, size:Math.max(34, Math.min(84, R*0.8)) });
    addCollected(b.word);
  }
  sparks.push({ ring:true, x:s.x, y:s.y, r:R, age:0, life:.22 });
  const n = 7 + Math.floor(Math.random()*5);
  for (let k = 0; k < n; k++){
    const a = Math.random()*Math.PI*2, sp = R*(3 + Math.random()*5) + 40;
    sparks.push({ x:s.x + Math.cos(a)*R, y:s.y + Math.sin(a)*R, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                  size:1.2 + Math.random()*2.2, age:0, life:.35 + Math.random()*.25, hue:b.hue });
  }
  if (vol > 0){ playPop(vol); buzz(); }
}

function hitTest(px, py){
  let best = null, bestZ = Infinity;
  for (const b of bubbles){
    const s = project(b.p); if (!s) continue;
    const R = b.r * s.k;
    if (Math.hypot(px - s.x, py - s.y) < Math.max(R * 1.1, 22) && s.z < bestZ){ best = b; bestZ = s.z; }
  }
  return best;
}

/* ---------- タッチ操作 ---------- */
let started = false;
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('pointerdown', e => {
  if (!started) return;
  e.preventDefault();
  try { cvs.setPointerCapture(e.pointerId); } catch(err){}
  const hit = hitTest(e.clientX, e.clientY);
  if (hit){ popBubble(hit, .5); holds.set(e.pointerId, null); return; }
  const dir = rayFromScreen(e.clientX, e.clientY);
  const b = makeBubble([dir[0]*HOLD_DIST, dir[1]*HOLD_DIST, dir[2]*HOLD_DIST], R_MIN);
  b.state = 'grow'; b.held = 0; b.sx = e.clientX; b.sy = e.clientY;
  if (pendingChars.length){ b.word = pendingChars.shift(); b.wordGrow = true; updateWordBtn(); }
  holds.set(e.pointerId, b);
});
cvs.addEventListener('pointermove', e => {
  const b = holds.get(e.pointerId);
  if (b){ b.sx = e.clientX; b.sy = e.clientY; }
});
function release(e){
  if (!holds.has(e.pointerId)) return;
  const b = holds.get(e.pointerId); holds.delete(e.pointerId);
  if (!b || b.state !== 'grow') return;
  const dir = rayFromScreen(b.sx, b.sy);
  const t = (b.r - R_MIN) / (R_MAX - R_MIN);
  launch(b, dir, 1.05 - 0.75*t);
  if (b.held < 0.18){
    const j = 0.06;
    const d2 = [dir[0] + (Math.random()-.5)*j, dir[1] + (Math.random()-.5)*j, dir[2] + (Math.random()-.5)*j];
    const n = Math.hypot(...d2);
    const c = makeBubble(b.p.slice(), R_MIN * (0.5 + Math.random()*0.4));
    launch(c, [d2[0]/n, d2[1]/n, d2[2]/n], 0.9 + Math.random()*0.4);
  }
}
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);
cvs.addEventListener('keydown', e => {
  if (!started || (e.key !== ' ' && e.key !== 'Enter')) return;
  e.preventDefault();
  const dir = rayFromScreen(W/2 + (Math.random()-.5)*80, H/2 + (Math.random()-.5)*80);
  launch(claimWord(makeBubble([dir[0]*HOLD_DIST, dir[1]*HOLD_DIST, dir[2]*HOLD_DIST], R_MIN*(1 + Math.random()))), dir, 1);
});

/* ---------- 息 ---------- */
let analyser = null, micStream = null, tbuf = null, floor = 0.01, emitAcc = 0;
const meter = document.getElementById('meter');
function breathLevel(){
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(tbuf);
  let s = 0; for (let i = 0; i < tbuf.length; i++) s += tbuf[i]*tbuf[i];
  const rms = Math.sqrt(s / tbuf.length);
  if (rms < floor * 2) floor = floor*0.98 + rms*0.02;
  const thr = Math.max(0.05, floor * 4);
  return rms > thr ? Math.min(1, (rms - thr) / 0.2 + 0.15) : 0;
}

/* ---------- 顔と口 ---------- */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
let faceLm = null, faceLoading = false, faceFailed = false, lastVideoTime = -1;
const mouth = { ok:false, x:0, y:0, pucker:0, open:0 };
let puckerArmed = true;

async function ensureFace(){
  if (faceLm || faceLoading || faceFailed) return;
  faceLoading = true;
  toast('顔の認識を準備しています。');
  try {
    const vision = await import(MP + '/vision_bundle.mjs');
    const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
    const opts = delegate => ({
      baseOptions:{ modelAssetPath:FACE_MODEL, delegate },
      runningMode:'VIDEO', numFaces:1, outputFaceBlendshapes:true
    });
    try { faceLm = await vision.FaceLandmarker.createFromOptions(files, opts('GPU')); }
    catch(e){ faceLm = await vision.FaceLandmarker.createFromOptions(files, opts('CPU')); }
    toast('顔を認識できるようになりました。');
  } catch(e){
    faceFailed = true;
    toast('顔を認識できないため、しゃぼん玉は画面の下から出ます。');
  }
  faceLoading = false;
}
function videoToScreen(nx, ny){
  const vw = video.videoWidth, vh = video.videoHeight;
  const k = Math.max(W / vw, H / vh);
  let x = (W - vw*k) / 2 + nx*vw*k;
  const y = (H - vh*k) / 2 + ny*vh*k;
  if (front) x = W - x;
  return [x, y];
}
function trackFace(){
  if (!faceLm || !front || !camStream || video.readyState < 2 || !video.videoWidth){ mouth.ok = false; return; }
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let res;
  try { res = faceLm.detectForVideo(video, performance.now()); } catch(e){ return; }
  const lm = res && res.faceLandmarks && res.faceLandmarks[0];
  if (!lm){ mouth.ok = false; return; }
  const [ux, uy] = videoToScreen(lm[13].x, lm[13].y);
  const [lx, ly] = videoToScreen(lm[14].x, lm[14].y);
  mouth.x = (ux + lx) / 2; mouth.y = (uy + ly) / 2; mouth.ok = true;
  let p = 0, o = 0;
  const bs = res.faceBlendshapes && res.faceBlendshapes[0];
  if (bs) for (const c of bs.categories){
    if (c.categoryName === 'mouthPucker' || c.categoryName === 'mouthFunnel') p = Math.max(p, c.score);
    if (c.categoryName === 'jawOpen') o = c.score;
  }
  mouth.pucker = mouth.pucker*0.6 + p*0.4;
  mouth.open = mouth.open*0.6 + o*0.4;
}

/* ---------- リング ---------- */
const rings = [];
let ringAcc = 1, ringSeq = 0;
function playRing(){
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(1100, t); o.frequency.exponentialRampToValueAtTime(320, t + 0.14);
  const g = actx.createGain(); g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

function spawnRing(){

               r:0.022, age:0, hue:(ringSeq++ * 47) % 360 });

}
function spawnForwardRing(){

               r:0.03, age:0, hue:(ringSeq++ * 47) % 360 });

    if (g.age > 1.6 || Math.hypot(g.p[0], g.p[1], g.p[2]) < 0.06){ rings.splice(i, 1); continue; }
    for (let j = bubbles.length - 1; j >= 0; j--){
      const b = bubbles[j];

function drawRings(){

  list.sort((a, b) => b[0].z - a[0].z);
  for (const [s, g] of list){
    const R = g.r * s.k;
    if (R < 1) continue;
    const fade = g.age > 1.3 ? Math.max(0, 1 - (g.age - 1.3) / 0.3) : 1;
    ctx.save();

    ctx.shadowBlur = 0;
    ctx.lineWidth = Math.max(1, R*0.06);

/* ---------- 描画 ---------- */
function drawBubble(x, y, R, b){
  const wobble = b.wob * 0.13 * Math.sin(now*24 + b.seed) + 0.02 * Math.sin(now*2.6 + b.seed);
  const h = (b.hue + now * 18) % 360;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1 + wobble, 1 - wobble);

  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
  g.addColorStop(0, 'rgba(255,255,255,0.03)');
  g.addColorStop(0.7, 'rgba(225,242,255,0.07)');
  g.addColorStop(0.93, `hsla(${h},90%,82%,0.30)`);
  g.addColorStop(1, `hsla(${(h+50)%360},90%,85%,0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2); ctx.fill();

  let rim;
  if (ctx.createConicGradient){
    rim = ctx.createConicGradient(now*0.4 + b.seed, 0, 0);
    for (let i = 0; i <= 6; i++) rim.addColorStop(i/6, `hsla(${(h + i*60)%360},95%,76%,${i % 2 ? 0.55 : 0.25})`);
  } else {
    rim = ctx.createLinearGradient(-R, -R, R, R);
    rim.addColorStop(0, `hsla(${h},95%,76%,.5)`); rim.addColorStop(1, `hsla(${(h+180)%360},95%,76%,.5)`);
  }
  ctx.strokeStyle = rim; ctx.lineWidth = Math.max(1, R*0.05);
  ctx.beginPath(); ctx.arc(0, 0, R*0.97, 0, Math.PI*2); ctx.stroke();

  if (b.word && R > 14){
    let fs = R*0.8;
    ctx.font = `800 ${fs}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;
    const tw = ctx.measureText(b.word).width;
    if (tw > R*1.3){ fs *= R*1.3/tw; ctx.font = `800 ${fs}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`; }
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(14,78,110,0.45)'; ctx.shadowBlur = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(b.word, 0, 0);
    ctx.restore();
  }
  ctx.save();
  ctx.translate(-R*0.38, -R*0.42); ctx.rotate(-0.65);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.ellipse(0, 0, R*0.2, R*0.09, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-R*0.12, -R*0.62, Math.max(0.8, R*0.04), 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(0.8, R*0.04); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, R*0.78, Math.PI*0.12, Math.PI*0.42); ctx.stroke();
  ctx.restore();
}

/* ---------- ループ ---------- */
let last = performance.now(), ambientAcc = 0;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now += dt;

  let tr = 0; for (let i = 0; i < 9; i++) tr += Mprev[i]*M[i];
  const ang = Math.acos(Math.max(-1, Math.min(1, (tr - 1) / 2)));
  rotSpeed = rotSpeed*0.6 + (dt > 0 ? ang/dt : 0)*0.4;
  Mprev = M.slice();

  if (!started){
    ambientAcc += dt * (reduceMotion ? 0.4 : 1.4);
    while (ambientAcc > 1){
      ambientAcc -= 1;
      const dir = rayFromScreen(W*(0.15 + Math.random()*0.7), H*(0.75 + Math.random()*0.2));
      const d = 0.4 + Math.random()*0.5;
      const b = makeBubble([dir[0]*d, dir[1]*d, dir[2]*d], R_MIN*(1 + Math.random()*2.5));
      b.life = 7 + Math.random()*4;
      launch(b, [(Math.random()-.5)*0.3, 1, (Math.random()-.5)*0.3], 0.08 + Math.random()*0.06);
    }
  }

  trackFace();
  const lvl = breathLevel();
  if (analyser) meter.style.width = Math.round(lvl * 28) + 'px';
  const fromMouth = front && mouth.ok;
  const shooting = started && fromMouth && mouth.open > 0.45;
  if (shooting){
    ringAcc += dt;
    if (ringAcc > 0.18){ ringAcc = 0; spawnRing(); }
  } else ringAcc = 1;
  if (started && fireHeld && !front){
    fireAcc += dt;
    if (fireAcc > 0.18){ fireAcc = 0; spawnForwardRing(); }
  } else fireAcc = 1;
  updateRings(dt);
  let blow = lvl;
  if (fromMouth && !shooting){
    const puck = mouth.pucker;
    blow = analyser ? (lvl > 0 && (puck > 0.15 || lvl > 0.5) ? lvl : 0) : 0;
    if (!analyser && started){
      if (!puckerArmed && puck < 0.3) puckerArmed = true;
      if (pendingChars.length){
        if (puckerArmed && puck > 0.45){ puckerArmed = false; blowFromMouth(0.4, true); }
      } else if (puckerArmed && puck > 0.45){

    emitAcc += dt * (5 + 20*blow);

      emitAcc -= 1;
      if (fromMouth){ blowFromMouth(blow); continue; }
      const dir = rayFromScreen(W/2 + (Math.random()-.5)*W*0.25, H*0.72 + (Math.random()-.5)*H*0.12);
      const b = claimWord(makeBubble([dir[0]*0.25, dir[1]*0.25, dir[2]*0.25], R_MIN*(0.6 + Math.random()*1.2)));
      if (b.word) b.r = R_MIN*2.2;
      launch(b, dir, 0.7 + lvl*0.8 + Math.random()*0.3);
    }
  }

  for (const [id, b] of holds){
    if (!b) continue;
    b.held += dt;
    b.r = Math.min(R_MAX, R_MIN + GROW * b.held);
    if (b.wordGrow && pendingChars.length){
      const want = 1 + Math.floor(b.held / 0.6);

    b.wob = b.wob*0.8 + (danger > 0.6 ? Math.min(1, (danger - 0.6) / 0.4) : 0)*0.2;
    const dir = rayFromScreen(b.sx, b.sy);

    b.v[vi] = b.v[vi]*damp + (Math.sin(now*0.5 + b.seed*2)*0.02 - 0.004)*dt;
    b.v[hi] = b.v[hi]*damp + Math.cos(now*0.6 + b.seed)*0.025*dt;

  }

  ctx.clearRect(0, 0, W, H);
  const list = [];
  for (const b of bubbles){ const s = project(b.p); if (s) list.push([s, b]); }
  for (const b of holds.values()){ if (b){ const s = project(b.p); if (s) list.push([s, b]); } }
  list.sort((a, b) => b[0].z - a[0].z);
  for (const [s, b] of list){

  }

  drawRings();
  for (let i = sparks.length - 1; i >= 0; i--){
    const p = sparks[i]; p.age += dt;
    const k = p.age / p.life;
    if (k >= 1){ sparks.splice(i, 1); continue; }

    } else {

    }
  }

    w.y -= 18*dt;
    const a = w.age < 0.25 ? w.age/0.25 : (w.age > 2.4 ? 1 - (w.age - 2.4)/0.8 : 1);

const PAIR_DIST = 1.5;
const myTag = Math.random().toString(36).slice(2, 7);

function upVec(){ return hasOri ? [0,0,1] : [0,1,0]; }
function basis(){
  const up = upVec();
  const f = aimF || (hasOri ? [0,1,0] : [0,0,-1]);
  const r = [f[1]*up[2] - f[2]*up[1], f[2]*up[0] - f[0]*up[2], f[0]*up[1] - f[1]*up[0]];
  return { f, r, up };
}
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
function toPair(w){ const B = basis(); return [dot(w, B.f), dot(w, B.r), dot(w, B.up)]; }
function fromFriend(q, isPos){
  const B = basis();
  const a = isPos ? PAIR_DIST - q[0] : -q[0], bb = -q[1], c = q[2];
  return [0,1,2].map(i => a*B.f[i] + bb*B.r[i] + c*B.up[i]);
}
function setAim(quiet){
  const back = [-M[2], -M[5], -M[8]];
  const up = upVec(), k = dot(back, up);
  const h = [back[0] - k*up[0], back[1] - k*up[1], back[2] - k*up[2]];
  const n = Math.hypot(h[0], h[1], h[2]);
  if (n < 0.2){ if (!quiet) toast('iPhoneを立てて、背面のカメラを相手に向けてください。'); return; }
  aimF = [h[0]/n, h[1]/n, h[2]/n];
  if (!quiet) toast('向きを合わせました。');
}
function pairOpen(){ return conn && conn.open; }
function sendPair(msg){ if (pairOpen()){ try { conn.send(msg); } catch(e){} } }
function shareBubble(b){
  if (!pairOpen() || b.remote) return;
  b.id = b.id || (myTag + '-' + (idSeq++));
  sendPair({ t:'bubble', id:b.id, p:toPair(b.p), v:toPair(b.v), r:b.r, word:b.word || '', hue:b.hue, life:b.life });
}
function shareRing(g){
  if (!pairOpen()) return;
  sendPair({ t:'ring', p:toPair(g.p), v:toPair(g.v), r:g.r, hue:g.hue });
}
function onPairData(m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'bubble'){
    const b = makeBubble(fromFriend(m.p, true), Math.min(R_MAX, Math.max(0.005, +m.r || R_MIN)));
    b.v = fromFriend(m.v, false); b.id = String(m.id); b.remote = true;
    b.word = typeof m.word === 'string' ? Array.from(m.word).slice(0, 20).join('') : '';
    b.hue = +m.hue || 0; b.life = Math.min(30, +m.life || 15);
    bubbles.push(b);
    while (bubbles.length > 160) popBubble(bubbles[0], 0);
  } else if (m.t === 'pop'){
    const b = bubbles.find(x => x.id === m.id);
    if (b){ b.remotePop = true; popBubble(b, .25); }
  } else if (m.t === 'ring'){
    rings.push({ p:fromFriend(m.p, true), v:fromFriend(m.v, false), r:+m.r || 0.03, age:0, hue:+m.hue || 0 });

  }
}
function setPairState(text, connected){

  pairInfo.textContent = '部屋を作っています。';
  peer.on('open', () => {
    pairCode.textContent = code; pairCode.hidden = false;
    pairInfo.textContent = '相手にこの部屋番号を伝えて、参加してもらってください。';
  });
  peer.on('connection', c => { if (pairOpen()){ c.close(); return; } attach(c); });
  peer.on('error', e => {
    if (e && e.type === 'unavailable-id') hostRoom();
    else pairInfo.textContent = 'つながりませんでした。インターネット接続を確認して、もう一度お試しください。';
  });
}
function joinRoom(){
  const code = codeInput.value.replace(/\D/g, '');
  if (code.length !== 4){ toast('4桁の部屋番号を入力してください。'); return; }
  if (typeof Peer === 'undefined'){ toast('接続の準備ができていません。ページを再読み込みしてください。'); return; }
  resetPeer();
  peer = new Peer();
  pairInfo.textContent = 'つないでいます。';
  codeInput.blur();
  peer.on('open', () => attach(peer.connect('shabondama-' + code, { reliable:true })));
  peer.on('error', e => {
    pairInfo.textContent = e && e.type === 'peer-unavailable'
      ? 'その部屋番号の部屋が見つかりません。番号を確かめてください。'
      : 'つながりませんでした。インターネット接続を確認して、もう一度お試しください。';
  });
}
pairBtn.addEventListener('click', () => {
  if (!pairPanel.hidden){ pairPanel.hidden = true; return; }
  document.getElementById('wordPanel').hidden = true;
  pairPanel.hidden = false;
});
document.getElementById('pairClose').addEventListener('click', () => { pairPanel.hidden = true; codeInput.blur(); });
document.getElementById('host').addEventListener('click', hostRoom);
joinBtn.addEventListener('click', joinRoom);
aimBtn.addEventListener('click', () => setAim(false));
codeInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); joinRoom(); } });

const fireBtn = document.getElementById('fire');
const barEl = document.querySelector('.bar');
function placeAboveBar(){
  const r = barEl.getBoundingClientRect();
  if (!r.height) return;
  document.documentElement.style.setProperty('--above-bar', Math.round(innerHeight - r.top + 14) + 'px');
}
addEventListener('resize', placeAboveBar);
if ('ResizeObserver' in window) new ResizeObserver(placeAboveBar).observe(barEl);
function fireOn(e){ e.preventDefault(); fireHeld = true; fireBtn.classList.add('active'); try { fireBtn.setPointerCapture(e.pointerId); } catch(err){} }
function fireOff(){ fireHeld = false; fireBtn.classList.remove('active'); }
fireBtn.addEventListener('pointerdown', fireOn);
fireBtn.addEventListener('pointerup', fireOff);
fireBtn.addEventListener('pointercancel', fireOff);
fireBtn.addEventListener('contextmenu', e => e.preventDefault());
fireBtn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); fireHeld = true; fireBtn.classList.add('active'); } });
fireBtn.addEventListener('keyup', fireOff);
const wordBtn = document.getElementById('wordBtn');
const wordPanel = document.getElementById('wordPanel');
const wordInput = document.getElementById('word');
function updateWordBtn(){
  const rest = pendingChars.join('');
  wordBtn.textContent = rest ? 'ことば：' + rest : 'ことば';
  wordBtn.setAttribute('aria-pressed', rest ? 'true' : 'false');
}
const collectEl = document.getElementById('collect');
let collected = '', collectTimer = 0;
function addCollected(ch){
  collected += ch;
  collectEl.textContent = collected;
  collectEl.classList.add('on');
  clearTimeout(collectTimer);
  collectTimer = setTimeout(() => { collected = ''; collectEl.classList.remove('on'); }, 6000);
}
function closeWordPanel(){ wordPanel.hidden = true; wordInput.blur(); }
wordBtn.addEventListener('click', () => {
  if (!wordPanel.hidden){ closeWordPanel(); return; }
  wordInput.value = pendingChars.join('');
  pairPanel.hidden = true;
  wordPanel.hidden = false;
  wordInput.focus();
});
function commitWord(){
  pendingChars = Array.from(wordInput.value).filter(c => c.trim() !== '').slice(0, 20);
  updateWordBtn();
  closeWordPanel();
  if (pendingChars.length) toast('「' + pendingChars.join('') + '」を1文字ずつしゃぼん玉に込めます。割ると文字が現れます。');
}
document.getElementById('wordOk').addEventListener('click', commitWord);
document.getElementById('wordCancel').addEventListener('click', () => { pendingChars = []; updateWordBtn(); closeWordPanel(); });
wordInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); commitWord(); } });
})();
</script>
</body>
</html>
